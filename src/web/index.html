<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Product View | PrintBox</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body data-page="index">
    <header>
      <a href="/products"><strong>▣ PrintBox</strong></a>
      <nav>
        <a href="/admin">Panel</a><a href="/products">Catálogo</a
        ><a href="/api/docs">API Docs ↗</a>
      </nav>
    </header>
    <main>
      <div class="heading">
        <div>
          <div class="eyebrow">Catálogo / Inventario</div>
          <h1>Productos</h1>
          <p>Consulta y administra los productos activos de PrintBox.</p>
        </div>
        <a class="button" href="/products/create">+ Nuevo producto</a>
      </div>
      <div id="message" role="status"></div>
      <section class="panel">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="products">
            <tr>
              <td colspan="5" class="empty">Cargando productos...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
    <script defer src="/assets/app.js"></script>
  </body>
</html>
